spring.application.name=careround-api-gateway

server.port=8080

# JWT (verify only; same RSA public key as every other service, NOT the JWKS endpoint)
app.jwt.public-key=${JWT_PUBLIC_KEY}

# Downstream services
app.routes.auth-url=http://localhost:8081
app.routes.user-url=http://localhost:8082
app.routes.ward-url=http://localhost:8083
app.routes.patient-url=http://localhost:8084
app.routes.round-url=http://localhost:8085
app.routes.care-task-url=http://localhost:8086
app.routes.notification-url=http://localhost:8087
app.routes.realtime-url=http://localhost:8088
app.routes.connect-timeout-ms=2000
app.routes.response-timeout-ms=30000

# Only the gateway's own health endpoint; downstream actuator/swagger are not routed
management.endpoints.web.exposure.include=health
