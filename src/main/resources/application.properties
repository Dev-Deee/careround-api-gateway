spring.application.name=careround-api-gateway

server.port=8080

# JWT (verify only; same RSA public key as every other service, NOT the JWKS endpoint)
app.jwt.public-key=${JWT_PUBLIC_KEY}

# Downstream services
app.routes.auth-url=http://localhost:8081
app.routes.user-url=http://localhost:8082
app.routes.ward-url=http://localhost:8083
app.routes.patient-url=http://localhost:8084
app.routes.round-url=http://localhost:8085
app.routes.care-task-url=http://localhost:8086
app.routes.notification-url=http://localhost:8087
app.routes.realtime-url=http://localhost:8088
app.routes.connect-timeout-ms=2000
app.routes.response-timeout-ms=30000

# CORS (comma-separated origin patterns)
app.cors.allowed-origins=http://localhost:*
app.cors.allow-credentials=false

# Rate limiting of the public auth endpoints (per client IP, per minute), counted in careround-redis
app.rate-limit.enabled=true
app.rate-limit.login-per-minute=10
app.rate-limit.refresh-per-minute=30
app.rate-limit.activate-per-minute=10
app.rate-limit.redis-timeout-ms=500
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Only the gateway's own health endpoint; downstream actuator/swagger are not routed
management.endpoints.web.exposure.include=health
# The gateway stays UP when Redis is down (the rate limiter fails open)
management.health.redis.enabled=false
